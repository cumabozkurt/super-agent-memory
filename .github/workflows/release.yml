name: release

# Pushing a vX.Y.Z tag:
#   1. checks that the tag matches package.json and runs the tests;
#   2. builds the npm tarball (`npm pack`) plus SHA256SUMS.txt and smoke-installs the tarball;
#   3. publishes that tarball to npm (with provenance) if the NPM_TOKEN secret exists; a version already on npm is skipped;
#   4. creates the GitHub Release (notes = the CHANGELOG.md section for that version) with both files attached.
# workflow_dispatch (no tag) is a dry run: steps 1-2 only, the tarball is kept as a workflow artifact.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write  # create the GitHub Release
  id-token: write  # npm provenance

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          test "${GITHUB_REF_NAME#v}" = "$v" || { echo "::error::tag $GITHUB_REF_NAME != package.json $v"; exit 1; }
      - name: Tests
        run: npm test
        env:
          SAM_TEST: '1'
      - name: npm pack + checksums
        shell: bash
        run: |
          mkdir -p release-assets
          npm pack --pack-destination release-assets
          cd release-assets && sha256sum * | tee SHA256SUMS.txt
      - name: Smoke-install the tarball
        shell: bash
        run: |
          npm i -g --prefix "$RUNNER_TEMP/g" ./release-assets/super-agent-memory-*.tgz
          "$RUNNER_TEMP/g/bin/sam" --version
          SAM_HOME="$RUNNER_TEMP/sam-home" "$RUNNER_TEMP/g/bin/sam" doctor
      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          node .github/scripts/changelog-section.mjs "$v" > notes.md
          cat >> notes.md <<MD

          ---

          **Install:** \`npm i -g super-agent-memory\` ([npm](https://www.npmjs.com/package/super-agent-memory)) and then \`sam install\`. Offline: \`npm i -g https://github.com/${GITHUB_REPOSITORY}/releases/download/v$v/super-agent-memory-$v.tgz\`. See the [README](https://github.com/${GITHUB_REPOSITORY}#readme) and [Getting started](https://github.com/${GITHUB_REPOSITORY}/blob/v$v/docs/getting-started.md). \`SHA256SUMS.txt\` holds the tarball's checksum.
          MD
          cat notes.md
      - uses: actions/upload-artifact@v6
        with:
          name: npm-package
          path: release-assets/*
          if-no-files-found: error
      - name: Publish to npm (only when the NPM_TOKEN secret exists)
        if: env.NPM_TOKEN != '' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "super-agent-memory@$v" version >/dev/null 2>&1; then
            echo "super-agent-memory@$v is already on npm, skipping"; exit 0
          fi
          # publish the exact tarball that is attached to the GitHub Release; tests already ran above
          npm publish ./release-assets/super-agent-memory-$v.tgz --provenance --access public
          # npm may process a publish for a few minutes ("Your package is being processed") before the
          # version is visible; a slow registry is only a warning, not a failed release
          for i in $(seq 1 30); do
            if npm view "super-agent-memory@$v" version >/dev/null 2>&1; then echo "super-agent-memory@$v is live"; exit 0; fi
            sleep 20
          done
          echo "::warning::super-agent-memory@$v was accepted by npm but is not visible yet; check https://www.npmjs.com/package/super-agent-memory"
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
            gh release edit "$TAG" --notes-file notes.md --draft=false --prerelease=false --latest
          else
            gh release create "$TAG" release-assets/* --verify-tag --latest \
              --title "Super Agent Memory $TAG" --notes-file notes.md
          fi
          gh release view "$TAG" --json url,isDraft,isPrerelease,assets --jq '{url, isDraft, isPrerelease, assets: [.assets[].name]}'
