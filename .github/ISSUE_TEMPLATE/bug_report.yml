name: Bug report
description: Something in SAM does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Security problems: please do not file them here; see SECURITY.md.**
        Redact real secrets from anything you paste (a fake key in the same format is fine).
  - type: input
    id: version
    attributes:
      label: SAM version
      description: Output of `sam --version`
      placeholder: 1.1.0
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version` (SAM needs 22.16+ or 24+)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Linux, Windows, WSL, Other]
    validations:
      required: true
  - type: dropdown
    id: agents
    attributes:
      label: Agent(s) involved
      multiple: true
      options: [Claude Code, Codex CLI, Gemini CLI, Antigravity, OpenCode, Cursor, Other MCP client, CLI only]
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `sam doctor`
      render: text
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: |
        Hook problems: re-run the hook with `SAM_DEBUG=1` and include stderr, e.g.
        `echo '{"session_id":"x","cwd":"'$PWD'"}' | SAM_DEBUG=1 sam hook SessionStart --agent claude`
      placeholder: |
        1. sam install claude
        2. ...
    validations:
      required: true
